<!doctype html>
<html><head><meta charset="utf-8"><title>Rossen Live Intro</title>
<style>
@font-face { font-family: Stamp; src: url(assets/fonts/BowlbyOneSC-Regular.ttf); }
@font-face { font-family: Marker; src: url(assets/fonts/PermanentMarker-Regular.ttf); }
body { margin: 0; background: #111; color: #ddd; font: 13px ui-monospace, monospace; }
canvas { display: block; max-width: 100vw; }
</style>
<script src="core.js"></script>
</head><body><canvas id="c"></canvas><div id="info"></div>
<script>
'use strict';
/* Rossen Reports: 15 s live-stream opener, one continuous shot, 1920x1080, drawn at 24 fps.

   Beat sheet (seconds)
   0.00-0.45  empty paper street (reference plate, Jeff removed). LIVE badge stamps down at 0.33 (thunk + shake).
   0.45-2.60  Jeff waddles in from the left, mic with the hand-drawn logo flag, settles at x=380.
   2.95-3.40  he pulls out a telescoping magnifier; the handle extends toward the table.
   3.40-4.60  lens over the phone: magnified view shows a sneaky scammer peeking from behind it.
   4.60-5.70  lens over the smoke detector: a tiny camera lens slides out of the grille, red dot blinking.
   5.70-6.55  lens over the gift card: tampered barcode sticker peels back.
   6.55-7.00  lens swings back to the phone; Jeff tosses the magnifier away.
   7.00-8.30  Jeff points; the scammer pops out; SCAM! stamp slams down at 7.30; scammer panics.
   8.30-9.40  scammer runs off right; six stolen bills flutter back into the wallet (8.35-10.3).
   10.55-10.75 wallet snaps shut, sparkle.
   10.90-12.90 shipping box drops, flaps pop, three price tags fly out: old price crossed out, new price written in.
   12.90-13.40 tags whoosh off; Jeff turns square to camera, hops, thumbs up.
   13.20-13.95 official logo paper-drops to centre with a soft bounce; the LIVE badge flies over and stamps beside it (13.82).
   14.00-15.00 hold: nothing moves.
*/
setFormat({ ar: '16:9', width: 1920 });
const FPS = 24, DUR = 15, NFR = FPS * DUR;
const G = 1016;                 // ground line in the plate
const TY = 800;                 // table top
const K = 0.94;                 // Jeff sprite px -> frame px
const AX = 252, AY = 694;       // sprite anchor: between the feet
const INK = '#2b2622', RED = '#d63a31', PAPER = '#ece8dc';
const SKIN = '#e8a474', JACKET = '#3d3a38', SHIRT = '#b9c9de';

// ---------------- assets ----------------
const IMG = {};
function loadImg(k, src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = () => rej(new Error('missing ' + src)); im.src = src; }); }
function alphaBox(im) {   // trim transparent margins so the logo is centred on its ink, not its canvas
  const o = document.createElement('canvas'); o.width = im.width; o.height = im.height; const g = o.getContext('2d'); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, o.width, o.height).data; let x0 = o.width, y0 = o.height, x1 = 0, y1 = 0;
  for (let y = 0; y < o.height; y++) for (let x = 0; x < o.width; x++) if (d[(y * o.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return x1 >= x0 ? [x0, y0, x1 - x0 + 1, y1 - y0 + 1] : [0, 0, im.width, im.height];
}

// ---------------- small helpers ----------------
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeOutBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rrPts(x, y, w, h, r, n = 6) {
  const p = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let k = 0; k <= n; k++) { const a = a0 + k / n * Math.PI / 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return p;
}
function densify(pts, step = 14, close = true) {
  const out = []; const n = pts.length;
  for (let i = 0; i < (close ? n : n - 1); i++) { const a = pts[i], b = pts[(i + 1) % n], L = Math.hypot(b[0] - a[0], b[1] - a[1]), m = Math.max(1, Math.ceil(L / step));
    for (let k = 0; k < m; k++) out.push([lerp(a[0], b[0], k / m), lerp(a[1], b[1], k / m)]); }
  if (!close) out.push(pts[n - 1]); return out;
}
function bbox(pts) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } return [x0 - 4, y0 - 4, x1 - x0 + 8, y1 - y0 + 8]; }
// crayon-filled shape in the reference's coloured-pencil manner: flat fill, dense same-hue strokes, paper flecks, dark wobbly outline
function shape(c, pts, fill, seed, o = {}) {
  const P = polyPath(pts), box = bbox(pts);
  c.fillStyle = fill; c.fill(P);
  hatch(c, P, box, { angle: o.angle ?? 1.05, gap: o.gap ?? 3.4, len: o.len ?? 13, jitter: 4, color: o.hc || shade(fill, .22), alpha: o.ha ?? .45, width: 1.3, seed });
  grain(c, P, box, Math.min(900, box[2] * box[3] / (o.fleck ?? 55)), '#fbf7ee', o.fa ?? .45, seed + 3, 1.6);
  if (o.outline !== false) crayon(c, densify(pts, 12, o.open ? false : true), o.ink || INK, o.lw ?? 5, seed + 9, !o.open);
  return P;
}
function line(c, pts, w, seed, col = INK) { crayon(c, densify(pts, 10, false), col, w, seed, false); }
function capsulePts(a, b, r, n = 10) {  // stadium around segment a-b
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), p = [];
  for (let k = 0; k <= n; k++) { const t = ang - Math.PI / 2 + k / n * Math.PI; p.push([b[0] + Math.cos(t) * r, b[1] + Math.sin(t) * r]); }
  for (let k = 0; k <= n; k++) { const t = ang + Math.PI / 2 + k / n * Math.PI; p.push([a[0] + Math.cos(t) * r, a[1] + Math.sin(t) * r]); }
  return p;
}
function text(c, s, x, y, font, col, align = 'center') { c.font = font; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = col; c.fillText(s, x, y); }

// ---------------- stamps (ink impressions), cached ----------------
const CACHE = {};
function inkTexture(g, w, h, seed, amount) {   // knock paper back through the ink: specks and dry drags
  const r = rng(seed); g.save(); g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < amount; i++) { g.globalAlpha = .25 + r() * .6; const s = .8 + r() * 2.6; g.fillRect(r() * w, r() * h, s, s * (.5 + r())); }
  g.lineCap = 'round'; for (let i = 0; i < amount / 60; i++) { g.globalAlpha = .18 + r() * .25; g.lineWidth = 1 + r() * 3; const x = r() * w, y = r() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 30 + r() * 90, y + (r() - .5) * 14); g.stroke(); }
  g.restore();
}
function liveBadge(w, h, dotOn = true) {
  const key = `live${w}x${h}${dotOn}`; if (CACHE[key]) return CACHE[key];
  const pad = 20, o = document.createElement('canvas'); o.width = w + pad * 2; o.height = h + pad * 2; const g = o.getContext('2d'); g.translate(pad, pad);
  const r = rng(w), pts = rrPts(0, 0, w, h, h * .22, 8).map(([x, y]) => [x + (r() - .5) * 2.4, y + (r() - .5) * 2.4]);
  g.fillStyle = RED; g.fill(polyPath(pts));
  g.globalCompositeOperation = 'destination-out';
  const fs = h * .66; g.font = `${fs}px Stamp`; g.textAlign = 'left'; g.textBaseline = 'middle';
  const tw = g.measureText('LIVE').width, dotR = h * .15, gap = h * .2, total = dotR * 2 + gap + tw, x0 = (w - total) / 2;
  g.fillText('LIVE', x0 + dotR * 2 + gap, h * .56);
  g.globalCompositeOperation = 'source-over';
  if (dotOn) { g.fillStyle = PAPER; g.beginPath(); g.arc(x0 + dotR, h * .5, dotR, 0, TAU); g.fill(); }
  else { g.globalCompositeOperation = 'destination-out'; g.lineWidth = Math.max(2, h * .035); g.beginPath(); g.arc(x0 + dotR, h * .5, dotR * .8, 0, TAU); g.stroke(); g.globalCompositeOperation = 'source-over'; }
  g.setTransform(1, 0, 0, 1, 0, 0); inkTexture(g, o.width, o.height, w + 7, w * h / 55);
  return CACHE[key] = o;
}
function scamStamp() {
  if (CACHE.scam) return CACHE.scam;
  const w = 470, h = 170, pad = 24, o = document.createElement('canvas'); o.width = w + pad * 2; o.height = h + pad * 2; const g = o.getContext('2d'); g.translate(pad, pad);
  g.strokeStyle = RED; g.lineJoin = 'round'; const r = rng(5);
  const frame = (ins, lw) => { g.lineWidth = lw; g.beginPath(); rrPts(ins, ins, w - ins * 2, h - ins * 2, 14, 5).forEach(([x, y], k) => { x += (r() - .5) * 2; y += (r() - .5) * 2; k ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); g.stroke(); };
  frame(4, 9); frame(18, 3.5);
  g.fillStyle = RED; g.font = '118px Stamp'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('SCAM!', w / 2, h * .54);
  g.setTransform(1, 0, 0, 1, 0, 0); inkTexture(g, o.width, o.height, 77, 1500);
  return CACHE.scam = o;
}
// stamp animation: drops from above scale, lands at tLand, small squash after
function drawStamp(c, img, x, y, rot, scale, t, tLand, spat = .5) {
  const a = seg(t, tLand - .12, tLand); if (t < tLand - .12) return;
  const s = t < tLand ? lerp(1.55, 1, easeIn(a)) : t < tLand + .12 ? 1 + .04 * Math.exp(-(t - tLand) * 30) * Math.cos((t - tLand) * 60) : 1;
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(scale * s, scale * s); c.globalAlpha = t < tLand ? .25 + .6 * a : .93;
  c.drawImage(img, -img.width / 2, -img.height / 2); c.restore();
  if (t >= tLand && t < tLand + spat) {   // ink spatter at impact
    const r = rng(Math.round(x + y)); c.save(); c.fillStyle = RED; c.globalAlpha = .75 * (1 - seg(t, tLand + spat * .5, tLand + spat));
    for (let k = 0; k < 11; k++) { const ang = r() * TAU, d = (img.width * scale * .5) * (.75 + r() * .45), s2 = 2 + r() * 5; c.beginPath(); c.arc(x + Math.cos(ang) * d, y + Math.sin(ang) * d * .45, s2, 0, TAU); c.fill(); }
    c.restore();
  }
}

// ---------------- price tags and bills, cached ----------------
function priceTag(oldP, newP, seed) {
  const key = 'tag' + seed; if (CACHE[key]) return CACHE[key];
  const w = 230, h = 132, pad = 14, o = document.createElement('canvas'); o.width = w + pad * 2; o.height = h + pad * 2; const g = o.getContext('2d'); g.translate(pad, pad);
  const pts = [[34, 0], [w, 0], [w, h], [34, h], [0, h * .72], [0, h * .28]];
  shape(g, pts, '#ecd39e', seed, { hc: '#c9a86a', ha: .35, lw: 4.5 });
  g.fillStyle = PAPER; g.beginPath(); g.arc(22, h / 2, 8, 0, TAU); g.fill(); g.strokeStyle = INK; g.lineWidth = 3; g.stroke();
  text(g, oldP, 132, 34, '38px Marker', '#4a3f38');
  g.strokeStyle = RED; g.lineWidth = 5; g.lineCap = 'round'; const tw = g.measureText(oldP).width; const r = rng(seed);
  g.beginPath(); g.moveTo(132 - tw / 2 - 8, 38 + r() * 4); g.lineTo(132 + tw / 2 + 8, 30 - r() * 4); g.stroke();
  g.beginPath(); g.moveTo(132 - tw / 2 - 6, 30); g.lineTo(132 + tw / 2 + 6, 40); g.stroke();
  text(g, newP, 134, 92, '62px Marker', RED);
  return CACHE[key] = o;
}
function bill() {
  if (CACHE.bill) return CACHE.bill;
  const w = 96, h = 46, pad = 8, o = document.createElement('canvas'); o.width = w + pad * 2; o.height = h + pad * 2; const g = o.getContext('2d'); g.translate(pad, pad);
  shape(g, rrPts(0, 0, w, h, 5, 3), '#9cc98a', 31, { hc: '#6f9f5f', lw: 3.2 });
  g.strokeStyle = '#4f7d44'; g.lineWidth = 2; g.strokeRect(7, 6, w - 14, h - 12);
  g.fillStyle = '#c7e3b8'; g.beginPath(); g.ellipse(w / 2, h / 2, 14, 15, 0, 0, TAU); g.fill(); g.stroke();
  text(g, '$', w / 2, h / 2 + 1, '24px Marker', '#3f6b36');
  return CACHE.bill = o;
}

// ---------------- props ----------------
function table(c) {
  shape(c, [[640, TY + 22], [656, TY + 22], [652, G], [636, G]], '#b98a5a', 41, { lw: 4 });
  shape(c, [[1432, TY + 22], [1448, TY + 22], [1452, G], [1436, G]], '#b98a5a', 42, { lw: 4 });
  shape(c, [[656, TY + 60], [1432, TY + 60], [1432, TY + 74], [656, TY + 74]], '#a97c50', 43, { lw: 3.5 });
  shape(c, [[612, TY], [1478, TY], [1470, TY + 26], [620, TY + 26]], '#cf9f68', 44, { lw: 5, angle: .08, len: 40 });
}
function wallet(c, t) {
  const x = 722, fillN = billsIn(t), close = seg(t, 10.55, 10.72), pop = t > 10.72 ? .06 * Math.exp(-(t - 10.72) * 9) * Math.sin((t - 10.72) * 40) : 0;
  const bw = 78, bh = 92, y = TY - bh;
  c.save(); c.translate(x, TY); c.scale(1 + pop, 1 - pop); c.translate(-x, -TY);
  // cash pocket content (bills sticking out of the top)
  if (close < 1) for (let k = 0; k < fillN; k++) {
    const r = rng(90 + k); c.save(); c.translate(x - 30 + k * 11 + (r() - .5) * 6, y + 14 - k * 2); c.rotate((r() - .5) * .3); const b = bill(); c.drawImage(b, -b.width * .32, -b.height * .45, b.width * .64, b.height * .64); c.restore();
  }
  if (close < 1) {
    const L = shape(c, rrPts(x - bw, y, bw, bh, 8, 3), '#8e5c3a', 51, { hc: '#6b4128' });
    // right flap folds over as the wallet closes
    const fw = bw * (1 - 2 * close);
    const fx = fw >= 0 ? x : x + fw;
    shape(c, rrPts(fx, y, Math.max(6, Math.abs(fw)), bh, 8, 3), fw >= 0 ? '#9a6844' : '#7c4d30', 52, { hc: '#6b4128' });
    if (fw > 20) { c.strokeStyle = '#5a3620'; c.lineWidth = 2.5; for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(fx + 10, y + 26 + k * 20); c.lineTo(fx + Math.abs(fw) - 10, y + 26 + k * 20); c.stroke(); } }
    c.strokeStyle = '#e8d2b0'; c.setLineDash([5, 5]); c.lineWidth = 2; c.strokeRect(x - bw + 8, y + 8, bw - 16, bh - 16); c.setLineDash([]);
  } else {
    // closed and plump
    shape(c, rrPts(x - bw, y - 8, bw, bh + 8, 10, 3), '#8e5c3a', 53, { hc: '#6b4128' });
    const b = bill(); c.save(); c.translate(x - bw / 2, y - 6); c.rotate(-.08); c.drawImage(b, -b.width * .3, -b.height * .3, b.width * .6, b.height * .6); c.restore();
    shape(c, rrPts(x - bw, y + 18, bw, bh - 18, 8, 3), '#9a6844', 54, { hc: '#6b4128' });
    c.strokeStyle = '#e8d2b0'; c.setLineDash([5, 5]); c.lineWidth = 2; c.strokeRect(x - bw + 7, y + 25, bw - 14, bh - 32); c.setLineDash([]);
    shape(c, rrPts(x - 18, y + 42, 22, 18, 5, 2), '#c9b27a', 55, { lw: 3 });
  }
  c.restore();
}
function phone(c) {
  const x = 905, w = 112, h = 198, y = TY - h;
  shape(c, [[x + 24, TY], [x + 70, TY - 70], [x + 80, TY - 64], [x + 42, TY]], '#9a948c', 61, { lw: 3.5 });   // kickstand
  shape(c, rrPts(x - w / 2, y, w, h, 18, 5), '#34364a', 62, { hc: '#1f2030' });
  const sx = x - w / 2 + 9, sy = y + 18, sw = w - 18, sh = h - 36;
  shape(c, rrPts(sx, sy, sw, sh, 8, 3), '#a9cdec', 63, { hc: '#86b1d8', lw: 2.5, ink: '#1f2030' });
  const cols = ['#e27d6a', '#f2c65c', '#7fb77e', '#6d8fd1', '#c58ad8', '#f09a5b'];
  for (let k = 0; k < 6; k++) { const cx = sx + 20 + (k % 3) * 27, cy = sy + 26 + Math.floor(k / 3) * 30; c.fillStyle = cols[k]; c.beginPath(); c.roundRect(cx - 9, cy - 9, 18, 18, 5); c.fill(); }
  c.fillStyle = '#1f2030'; c.beginPath(); c.roundRect(x - 14, y + 7, 28, 6, 3); c.fill();
}
function detector(c, t, reveal) {
  const x = 1125, cy = TY - 84, R = 66;
  shape(c, [[x - 44, TY], [x + 44, TY], [x + 26, TY - 26], [x - 26, TY - 26]], '#c9c4b8', 71, { lw: 4 });
  shape(c, ellPts(x, cy, R, R, 0, 40), '#f1efe8', 72, { hc: '#c9c6bd', ha: .5 });
  crayon(c, ellPts(x, cy, R * .62, R * .62, 0, 34), '#8b877d', 2.6, 73, true);
  c.strokeStyle = '#8b877d'; c.lineWidth = 3; c.lineCap = 'round';
  for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(x - 22, cy + k * 9); c.lineTo(x + 22, cy + k * 9); c.stroke(); }
  c.fillStyle = '#6fbf5a'; c.beginPath(); c.arc(x + R * .72, cy - R * .2, 4.5, 0, TAU); c.fill();
  const out = reveal ? seg(t, 4.95, 5.2) : 0;
  if (out > 0) {   // tiny camera sliding out of the grille
    const r = 5 + 13 * easeOutBack(out);
    c.fillStyle = '#26252c'; c.beginPath(); c.arc(x, cy, r + 5, 0, TAU); c.fill();
    c.fillStyle = '#4a5f8f'; c.beginPath(); c.arc(x, cy, r, 0, TAU); c.fill();
    c.fillStyle = '#0f1016'; c.beginPath(); c.arc(x, cy, r * .55, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(x - r * .35, cy - r * .35, r * .22, 0, TAU); c.fill();
    if (Math.floor(t * 4) % 2 === 0) { c.fillStyle = '#e8352b'; c.beginPath(); c.arc(x + r + 12, cy - r - 4, 5, 0, TAU); c.fill(); }
  } else { c.fillStyle = '#3a3836'; c.beginPath(); c.arc(x, cy, 2.6, 0, TAU); c.fill(); }
}
function giftCard(c, t, reveal) {
  const x = 1345, w = 188, h = 120;
  shape(c, [[x - 30, TY], [x + 30, TY], [x + 20, TY - 12], [x - 20, TY - 12]], '#9a948c', 81, { lw: 3.5 });
  c.save(); c.translate(x, TY - 10); c.rotate(-.09);
  shape(c, rrPts(-w / 2, -h, w, h, 12, 4), '#d9574c', 82, { hc: '#b43e35' });
  c.fillStyle = '#f3d36b'; c.fillRect(-w / 2 + 50, -h, 18, h); c.fillRect(-w / 2, -h + 44, w, 16);
  crayon(c, [[-w / 2 + 50, -h], [-w / 2 + 50, 0]], shade('#f3d36b', .3), 1.5, 83);
  c.save(); c.translate(-w / 2 + 59, -h + 52);
  shape(c, ellPts(-16, -10, 17, 10, -.5, 18), '#f3d36b', 84, { lw: 3 }); shape(c, ellPts(16, -10, 17, 10, .5, 18), '#f3d36b', 85, { lw: 3 });
  shape(c, ellPts(0, 0, 8, 8, 0, 12), '#e9bf4a', 86, { lw: 3 }); c.restore();
  text(c, '$50', 38, -h + 38, '38px Marker', PAPER);
  // barcode sticker
  const bx = -w / 2 + 92, by = -h + 70, bw2 = 80, bh2 = 36;
  const bars = (ox, oy, seed) => { const r = rng(seed); c.fillStyle = '#26252c'; let u = 6; while (u < bw2 - 6) { const ww = 1.5 + r() * 3.5; c.fillRect(ox + u, oy + 5, ww, bh2 - 10); u += ww + 1.5 + r() * 3; } };
  const peel = reveal ? seg(t, 6.0, 6.28) : 0;
  if (peel > 0) { c.fillStyle = '#f7f4ea'; c.fillRect(bx, by, bw2, bh2); bars(bx, by, 88); c.fillStyle = 'rgba(214,58,49,.22)'; c.fillRect(bx, by, bw2, bh2); }
  c.save();
  if (peel > 0) { c.beginPath(); c.rect(bx - 200, by - 200, 200 + bw2 * (1 - .55 * peel), 400); c.clip(); }
  c.fillStyle = '#f7f4ea'; c.fillRect(bx, by, bw2, bh2); bars(bx, by, 87); c.strokeStyle = '#8b877d'; c.lineWidth = 1.5; c.strokeRect(bx, by, bw2, bh2);
  c.restore();
  if (peel > 0) { const px = bx + bw2 * (1 - .55 * peel); c.fillStyle = '#dcd6c6'; c.beginPath(); c.moveTo(px, by); c.lineTo(px + 18 * peel, by + 4); c.lineTo(px + 22 * peel, by + bh2 - 2); c.lineTo(px, by + bh2); c.closePath(); c.fill(); c.strokeStyle = '#8b877d'; c.stroke(); }
  c.restore();
}

// ---------------- the scammer ----------------
// local coords: origin between the feet, ~110 px tall. mood: 0 sly, 1 panic. run: leg phase or null.
function scammer(c, x, y, s, o = {}) {
  const { mood = 0, run = null, peek = 0, look = 0, t = 0, flip = 1 } = o;
  c.save(); c.translate(x, y); c.scale(s * flip, s);
  const shake = mood > .5 ? Math.sin(t * 90) * 2.2 : 0; c.translate(shake, 0);
  const lp = run == null ? 0 : run;

function drawScene(c, t) {

function sparkle(c, x, y, u, seed) {

// logo: paper drop to centre, soft bounce, then perfectly still from 13.95
const LOGO_BOX = [720, 400], LOGO_C = [960, 520];
function finale(c, t) {

  const small = [1480, 360], sScale = .62;

      c.save(); c.globalAlpha = .18; c.fillStyle = INK; c.translate(x + 14, y + 22); c.rotate(-.05 + fly * -.03); c.beginPath(); c.roundRect(-150 * s, -61 * s, 300 * s, 122 * s, 26 * s); c.fill(); c.restore();

    }

    const im = IMG.logo, [bx, by, bw, bh] = IMG.logoBox, sc = Math.min(LOGO_BOX[0] / bw, LOGO_BOX[1] / bh), w = bw * sc, h = bh * sc;
    let y = LOGO_C[1], rot = 0, sx = 1, sy = 1, shA = .16;
    if (t < 13.55) { const a = seg(t, 13.2, 13.55); y = lerp(-h, LOGO_C[1], easeIn(a)); rot = .07 * Math.cos(a * 5) * (1 - a); shA = .16 * a; }
    else if (t < 13.95) { const u = t - 13.55; y = LOGO_C[1] - Math.abs(Math.sin(seg(t, 13.55, 13.8) * Math.PI)) * 26 * (t < 13.8 ? 1 : 0); const sq = Math.exp(-u * 14) * Math.cos(u * 36) * .05; sx = 1 + sq; sy = 1 - sq; }
    const lift = clamp((LOGO_C[1] - y) / 400, 0, 1);
    c.save(); c.globalAlpha = shA * (1 - .5 * lift); c.translate(LOGO_C[0] + 12 + 30 * lift, LOGO_C[1] + 18 + 40 * lift); c.drawImage(IMG.logoShadow, bx, by, bw, bh, -w / 2, -h / 2, w, h); c.restore();
    c.save(); c.translate(LOGO_C[0], y + h / 2); c.rotate(rot); c.scale(sx, sy); c.translate(0, -h / 2);

}
